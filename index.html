<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Интерактивный туториал: пять уровней мониторинга, отладки и диагностики SQLite — от инструментов ОС до байтов WAL и байткода VDBE."
    />
    <meta name="theme-color" content="#060a12" />
    <title>Матрёшка мониторинга SQLite</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Cpath d='M32 9c-7 0-11 5-11 11 0 3 1 6 3 8-6 4-9 11-9 18 0 6 4 9 9 9 3 0 6-1 8-3 2 2 5 3 8 3 5 0 9-3 9-9 0-7-3-14-9-18 2-2 3-5 3-8 0-6-4-11-11-11z' fill='none' stroke='%235eead4' stroke-width='3'/%3E%3Ccircle cx='32' cy='24' r='4' fill='%23fbbf24'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before the first paint to avoid a bright flash.
      try {
        var storedTheme = localStorage.getItem('sqlite-matryoshka:theme');
        document.documentElement.dataset.theme = storedTheme === 'light' ? 'light' : 'dark';
      } catch (error) {
        /* localStorage can be blocked in private mode — keep the default theme. */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
